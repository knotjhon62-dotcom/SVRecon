name: build-windows-wheels
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # CUDA 12.4.0: matches the tested setup (torch 2.5.0 + cu124)
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'
          method: network
          use-github-cache: false
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev"]'

      - uses: ilammy/msvc-dev-cmd@v1

      # Windows headers #define near/far as empty -> rename those variables
      - name: Patch sources for Windows
        shell: bash
        run: |
          cd cuda
          for f in $(grep -rlE '\b(near|far)\b' src binding.cpp --include='*.cu' --include='*.h' --include='*.cuh' --include='*.cpp' || true); do
            sed -i -E 's/\bnear\b/near_plane/g; s/\bfar\b/far_plane/g' "$f"
            echo "patched near/far in $f"
          done

      - name: Build wheels
        shell: bash
        env:
          DISTUTILS_USE_SDK: "1"
          # -Duint=unsigned : 'uint' is Linux-only
          # _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH : guards against the windows-2022
          # image's MSVC/STL being newer than what CUDA 12.4 officially supports
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler -w -Duint=unsigned -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          CL: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          # RTX A2000 = Ampere = 8.6
          TORCH_CUDA_ARCH_LIST: "8.6"
          MAX_JOBS: "1"
        run: |
          set -o pipefail
          # Make MSVC link.exe win over Git's /usr/bin/link.exe
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cu124
          pip install wheel setuptools ninja numpy
          pip wheel ./cuda --no-build-isolation --no-deps -w dist -v 2>&1 | tee build.log || {
            echo "================ ERRORS ================"
            grep -n -i -E "error|FAILED:" build.log | grep -v -i "warning" | head -60
            exit 1
          }
          pip wheel git+https://github.com/rahul-goel/fused-ssim/ --no-build-isolation --no-deps -w dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-cu124
          path: |
            dist/*.whl
            build.log
